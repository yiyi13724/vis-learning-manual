<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>线性回归与残差 · 可视化案例</title><link rel="stylesheet" href="../assets/course.css"><link rel="icon" href="../assets/favicon.svg"></head><body><header class="masthead"><div class="shell"><a class="brandmark" href="./">← 返回案例库</a><a href="../lesson-04/#ch-4-3">学习曲线拟合 →</a></div></header><main class="shell"><section class="lab-intro"><p class="eyebrow">OBSERVATIONS / FIT / RESIDUALS</p><h1>线性回归与残差</h1><p>圆点是观测，直线是最小二乘拟合。残差表示观测值与相同 x 位置的预测值之差。</p></section><section class="lab-stage"><label><input type="checkbox" id="show-residuals"> 显示残差线</label><svg id="regression-chart" viewBox="0 0 720 360" role="img" aria-label="十个观测点、拟合直线和可切换的残差线"></svg><p id="regression-result" role="status"></p><p>教学合成数据。拟合关系用于概括这组样本，不构成因果判断或外推保证。</p></section></main><script src="../assets/vendor/d3.v7.min.js"></script><script>
const points=[{x:8,y:3},{x:2,y:10},{x:11,y:3},{x:6,y:6},{x:5,y:8},{x:4,y:12},{x:12,y:1},{x:9,y:4},{x:6,y:9},{x:1,y:14}];
const meanX=d3.mean(points,d=>d.x),meanY=d3.mean(points,d=>d.y),slope=d3.sum(points,d=>(d.x-meanX)*(d.y-meanY))/d3.sum(points,d=>(d.x-meanX)**2),intercept=meanY-slope*meanX;
function draw(){const svg=d3.select('#regression-chart');svg.selectAll('*').remove();const x=d3.scaleLinear().domain([0,13]).range([60,650]),y=d3.scaleLinear().domain([0,16]).range([300,25]);svg.append('g').attr('transform','translate(0,300)').call(d3.axisBottom(x));svg.append('g').attr('transform','translate(60,0)').call(d3.axisLeft(y));if(document.querySelector('#show-residuals').checked)svg.selectAll('line.residual').data(points).join('line').attr('class','residual').attr('x1',d=>x(d.x)).attr('x2',d=>x(d.x)).attr('y1',d=>y(d.y)).attr('y2',d=>y(intercept+slope*d.x)).attr('stroke','#8a6a32').attr('stroke-dasharray','4 3');svg.append('path').datum([0,13]).attr('d',d3.line().x(x).y(d=>y(intercept+slope*d))).attr('stroke','#164f85').attr('stroke-width',2).attr('fill','none');svg.selectAll('circle').data(points).join('circle').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('r',5).attr('fill','#087f8c').append('title').text(d=>`x=${d.x}, y=${d.y}, 残差=${(d.y-intercept-slope*d.x).toFixed(2)}`);document.querySelector('#regression-result').textContent=`拟合方程：y = ${slope.toFixed(3)}x + ${intercept.toFixed(3)}。样本数：${points.length}。${document.querySelector('#show-residuals').checked?'虚线长度表示各点残差的绝对大小。':''}`}
document.querySelector('#show-residuals').onchange=draw;draw();
</script></body></html>
